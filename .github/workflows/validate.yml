name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate package structure
        run: python3 scripts/validate-skill.py

      - name: Run regression tests
        run: |
          python3 scripts/test_lint_commit.py
          python3 scripts/test_validate_skill.py

      - name: Check example messages
        run: |
          python3 - <<'PY'
          import re, subprocess
          text = open("references/example-library.md", encoding="utf-8").read()
          for block in re.findall(r"```text\n(.*?)```", text, re.S):
              subprocess.run(["python3", "scripts/lint-commit.py", "-"], input=block, text=True, check=True)
          PY

      - name: Check commit messages
        env:
          TRAILER: "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare against; skipping."
            exit 0
          fi
          python3 scripts/lint-commit.py --human --trailer "$TRAILER" --range "$BASE..$HEAD"
